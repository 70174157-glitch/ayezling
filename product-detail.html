<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYEZLING | Product Details</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #8C3B5B;
      --bg: #FAF8F5;
      --card-bg: #FFFFFF;
      --text: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); }

    /* HEADER / NAVBAR */
    header {
      text-align: center;
      padding: 25px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid #f2e6eb;
    }

    .brand-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: 3px;
    }

    /* PRODUCT DETAIL CONTAINER */
    .product-detail-container {
      max-width: 1000px;
      margin: 50px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
    }

    /* IMAGE GALLERY / BOX */
    .image-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid #f2e6eb;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }

    .product-img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 12px;
    }

    /* INFO SECTION */
    .product-info {
      padding: 10px 0;
    }

    .product-category {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888888;
      margin-bottom: 12px;
    }

    .product-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      color: var(--primary);
      margin-bottom: 15px;
      line-height: 1.2;
    }

    .product-price {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      margin-bottom: 20px;
    }

    .product-description {
      font-size: 14px;
      line-height: 1.6;
      color: #666666;
      margin-bottom: 30px;
    }

    /* QUANTITY CONTROLS */
    .quantity-control {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn-qty {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-qty:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .qty-number {
      font-size: 16px;
      font-weight: 600;
      min-width: 20px;
      text-align: center;
    }

    /* ADD TO CART BUTTON */
    .btn-add-cart {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px 35px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    .btn-add-cart:hover {
      opacity: 0.9;
    }

    /* TOAST NOTIFICATION */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
    }

    .toast-card {
      padding: 12px 20px;
      border-radius: 10px;
      background: #333;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border-left: 4px solid var(--primary);
    }

    @media (max-width: 768px) {
      .product-detail-container {
        grid-template-columns: 1fr;
        gap: 30px;
        margin: 20px auto;
      }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <header>
    <a href="index.html" class="brand-logo">AYEZLING</a>
  </header>

  <main class="product-detail-container">
    <!-- LEFT SIDE: PRODUCT IMAGE -->
    <div class="image-card">
      <img id="productImage" class="product-img" src="https://via.placeholder.com/400?text=Loading..." alt="Product Image">
    </div>

    <!-- RIGHT SIDE: PRODUCT DETAILS -->
    <div class="product-info">
      <div id="productCategory" class="product-category">CATEGORY</div>
      <h1 id="productTitle" class="product-title">Loading Product...</h1>
      <div id="productPrice" class="product-price">Rs. 0</div>
      
      <p id="productDescription" class="product-description">
        Handmade with high-quality beads and materials. Ideal for gifting and everyday aesthetic wear.
      </p>

      <div class="quantity-control">
        <button class="btn-qty" onclick="changeQty(-1)">-</button>
        <span id="qtyDisplay" class="qty-number">1</span>
        <button class="btn-qty" onclick="changeQty(1)">+</button>
      </div>

      <button id="addToCartBtn" class="btn-add-cart" onclick="addToCart()">ADD TO CART</button>
    </div>
  </main>

  <!-- FIREBASE LIBRARIES -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyASgbdHr8Vc1EWaEVxZvZA9-TYbJnUfcws",
      authDomain: "ayezling.firebaseapp.com",
      databaseURL: "https://ayezling-default-rtdb.firebaseio.com",
      projectId: "ayezling",
      storageBucket: "ayezling.firebasestorage.app",
      messagingSenderId: "178860148015",
      appId: "1:178860148015:web:339d74bb9f0b41b6574dda"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentQty = 1;
    let currentProduct = null;

    // CLEAN IMAGE URL HELPER
    function getCleanImagePath(img) {
      const fallback = 'https://via.placeholder.com/400?text=No+Image';
      if (!img) return fallback;
      
      let cleanImg = String(img).trim().replace(/\\/g, '/');
      
      if (cleanImg.startsWith('http://') || cleanImg.startsWith('https://') || cleanImg.startsWith('data:image')) {
        return cleanImg;
      }
      
      if (cleanImg.startsWith('/')) cleanImg = cleanImg.substring(1);
      return cleanImg;
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-card';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // FETCH PRODUCT DETAILS FROM URL QUERY PARAMETER (?id=...)
    function loadProductDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        document.getElementById('productTitle').innerText = "Product Not Found";
        return;
      }

      database.ref('products/' + productId).once('value').then((snapshot) => {
        const product = snapshot.val();

        if (!product) {
          document.getElementById('productTitle').innerText = "Product Not Found";
          return;
        }

        currentProduct = { id: productId, ...product };

        // SET UI DATA
        document.getElementById('productTitle').innerText = product.title || 'Product Details';
        document.getElementById('productCategory').innerText = product.category || 'JEWELLERY';
        document.getElementById('productPrice').innerText = `Rs. ${product.price || 0}`;

        // FIX IMAGE URL LOGIC
        const rawImg = product.image || product.imageUrl || product.img;
        const finalImgUrl = getCleanImagePath(rawImg);
        
        const imgElem = document.getElementById('productImage');
        imgElem.src = finalImgUrl;
        imgElem.alt = product.title || 'Product Image';
        imgElem.onerror = function() {
          this.onerror = null;
          this.src = 'https://via.placeholder.com/400?text=Image+Not+Found';
        };

      }).catch((err) => {
        console.error("Error fetching product:", err);
        document.getElementById('productTitle').innerText = "Error loading product";
      });
    }

    function changeQty(amt) {
      if (currentQty + amt >= 1) {
        currentQty += amt;
        document.getElementById('qtyDisplay').innerText = currentQty;
      }
    }

    function addToCart() {
      if (!currentProduct) return;

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existingIndex = cart.findIndex(item => item.id === currentProduct.id);

      if (existingIndex > -1) {
        cart[existingIndex].quantity += currentQty;
      } else {
        cart.push({
          id: currentProduct.id,
          title: currentProduct.title,
          price: currentProduct.price,
          image: getCleanImagePath(currentProduct.image || currentProduct.imageUrl || currentProduct.img),
          quantity: currentQty
        });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      showToast(`${currentProduct.title} added to cart!`);
    }

    window.onload = loadProductDetails;
  </script>
</body>
</html>
