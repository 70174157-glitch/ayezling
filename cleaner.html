<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYEZLING - Firebase Cleaner Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #FAF8F5; color: #333; padding: 40px 20px; display: flex; justify-content: center; }
    .box { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 650px; width: 100%; border: 1px solid #f2e6eb; }
    h1 { color: #8C3B5B; margin-bottom: 10px; font-size: 24px; }
    p { color: #666; font-size: 13px; margin-bottom: 25px; line-height: 1.6; }
    .btn { border: none; padding: 14px 24px; font-size: 14px; font-weight: 600; border-radius: 30px; cursor: pointer; width: 100%; margin-bottom: 12px; transition: background 0.3s; color: white; }
    .btn-warning { background: #d97706; }
    .btn-warning:hover { background: #b45309; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #991b1b; }
    .status { margin-top: 20px; padding: 15px; border-radius: 8px; background: #f8f9fa; font-size: 13px; font-family: monospace; white-space: pre-wrap; max-height: 280px; overflow-y: auto; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <div class="box">
    <h1>AYEZLING - Database Cleaner</h1>
    <p>Aap apne Firebase database se saare extra duplicate products auto-delete kar sakte hain, ya bilkul zero se reset kar sakte hain.</p>

    <button class="btn btn-warning" onclick="removeDuplicatesOnly()">🧹 Remove Duplicates Only (Keep 1 Copy)</button>
    <button class="btn btn-danger" onclick="deleteAllProducts()">💥 Delete ALL Products (Clear Everything)</button>

    <div class="status" id="logBox">Status: Ready...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyASgbdHr8Vc1EWaEVxZvZA9-TYbJnUfcws",
      authDomain: "ayezling.firebaseapp.com",
      databaseURL: "https://ayezling-default-rtdb.firebaseio.com",
      projectId: "ayezling",
      messagingSenderId: "178860148015",
      appId: "1:178860148015:web:339d74bb9f0b41b6574dda"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function logMsg(msg) {
      const logBox = document.getElementById('logBox');
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function removeDuplicatesOnly() {
      const logBox = document.getElementById('logBox');
      logBox.innerText = "🔍 Reading products from Firebase...";

      try {
        const snapshot = await database.ref('products').once('value');
        const data = snapshot.val();

        if (!data) {
          logBox.innerText = "⚠️ Database is already empty!";
          return;
        }

        const entries = Object.entries(data);
        logMsg(`📊 Total items found in database: ${entries.length}`);

        const seenKeys = new Set();
        let duplicateCount = 0;
        let keepCount = 0;

        for (const [key, item] of entries) {
          if (!item) continue;
          
          const uniqueIdentifier = (item.image || item.title || '').trim().toLowerCase();

          if (seenKeys.has(uniqueIdentifier)) {
            await database.ref('products/' + key).remove();
            duplicateCount++;
            logMsg(`🗑️ Deleted Duplicate [${key}]: ${item.title}`);
          } else {
            seenKeys.add(uniqueIdentifier);
            keepCount++;
          }
        }

        logMsg(`\n🎉 Cleanup Complete!\n✅ Kept Unique Products: ${keepCount}\n🗑️ Deleted Extra Duplicates: ${duplicateCount}`);
        alert(`Cleanup Done! Deleted ${duplicateCount} duplicate products.`);

      } catch (err) {
        logMsg("❌ Error: " + err.message);
      }
    }

    async function deleteAllProducts() {
      const confirmText = prompt("Type 'DELETE' to confirm removing ALL products from database:");
      if (confirmText !== 'DELETE') {
        alert("Cancelled!");
        return;
      }

      document.getElementById('logBox').innerText = "⏳ Deleting all products...";
      try {
        await database.ref('products').remove();
        document.getElementById('logBox').innerText = "💥 ALL products have been deleted successfully from Firebase!";
        alert("Database Cleared!");
      } catch (err) {
        logMsg("❌ Error deleting products: " + err.message);
      }
    }
  </script>
</body>
</html>
