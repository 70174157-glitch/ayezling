<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write a Review | AYEZLING</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #FAF8F5; padding: 40px 20px; color: #333; }
    .form-container { max-width: 450px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; border: 1px solid #f2e6eb; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { color: #8C3B5B; margin-bottom: 20px; text-align: center; }
    label { font-size: 13px; font-weight: 600; margin-top: 10px; display: block; color: #555; }
    input, textarea, select { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; background: #8C3B5B; color: #fff; border: none; padding: 12px; border-radius: 30px; margin-top: 20px; font-weight: 600; cursor: pointer; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Write a Review</h2>
    <form id="reviewForm">
      <label>Your Name</label>
      <input type="text" id="reviewerName" required placeholder="Enter your name">

      <label>Rating</label>
      <select id="reviewerRating" required>
        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
        <option value="4">⭐⭐⭐⭐ (4/5)</option>
        <option value="3">⭐⭐⭐ (3/5)</option>
        <option value="2">⭐⭐ (2/5)</option>
        <option value="1">⭐ (1/5)</option>
      </select>

      <label>Your Review</label>
      <textarea id="reviewerComment" rows="4" required placeholder="Share your experience..."></textarea>

      <button type="submit">Submit Review</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyASgbdHr8Vc1EWaEVxZvZA9-TYbJnUfcws",
      authDomain: "ayezling.firebaseapp.com",
      databaseURL: "https://ayezling-default-rtdb.firebaseio.com",
      projectId: "ayezling",
      storageBucket: "ayezling.firebasestorage.app",
      messagingSenderId: "178860148015",
      appId: "1:178860148015:web:339d74bb9f0b41b6574dda"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    document.getElementById('reviewForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('reviewerName').value;
      const rating = Number(document.getElementById('reviewerRating').value);
      const comment = document.getElementById('reviewerComment').value;

      database.ref('reviews').push({
        name: name,
        rating: rating,
        comment: comment,
        createdAt: new Date().toISOString()
      }).then(() => {
        alert('Thank you for your review!');
        window.location.href = 'index.html';
      }).catch((error) => {
        alert('Error submitting review: ' + error.message);
      });
    });
  </script>
</body>
</html>
