    // FUNCTION TO UPLOAD ALL PRODUCTS AUTOMATICALLY
    function uploadEmbeddedProducts() {
      if (confirm(`Aapke ${embeddedProducts.length} items Live Store par upload hone lage hain. Proceed karein?`)) {
        let count = 0;
        embeddedProducts.forEach(item => {
          database.ref('products').push({
            title: item.title,
            price: Number(item.price),
            category: item.category,
            image: item.image,
            salesCount: 0
          }).then(() => {
            count++;
            if (count === embeddedProducts.length) {
              alert("✨ Mubarak ho! Saare 50+ products Firebase Database par live upload ho chuke hain!");
            }
          });
        });
      }
    }

    // SINGLE PRODUCT UPLOAD
    function addNewProduct(e) {

      database.ref('products').push({

        price: Number(document.getElementById('p-price').value),
        category: document.getElementById('p-category').value,
        image: document.getElementById('p-image').value,
