    function logMsg(msg) {
      const logBox = document.getElementById('logBox');
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function uploadProductsToFirebase() {
      if (!productsToAdd || productsToAdd.length === 0) {
        alert("No products found to upload!");
        return;
      }

      document.getElementById('logBox').innerText = "Checking existing products in Firebase database...";

      try {
        // 1. Fetch existing products from Firebase
        const snapshot = await database.ref('products').once('value');
        const existingData = snapshot.val() || {};

        // 2. Store existing image paths to detect duplicates
        const existingImages = new Set();
        Object.values(existingData).forEach(prod => {
          if (prod && prod.image) existingImages.add(prod.image);
        });

        logMsg(`🔍 Found ${existingImages.size} items already in Firebase.`);

        // 3. Filter out products that are already in Firebase
        const newProducts = productsToAdd.filter(prod => !existingImages.has(prod.image));

        if (newProducts.length === 0) {
          logMsg("\n⚠️ All products in this array already exist in Firebase! Zero new items added.");
          alert("All products already exist in Firebase! No duplicates were created.");
          return;
        }

        logMsg(`🚀 Found ${newProducts.length} new products to upload...\n`);

        // 4. Upload only the NEW items
        let count = 0;
        for (let prod of newProducts) {
          const newRef = database.ref('products').push();
          await newRef.set({
            title: prod.title,
            price: prod.price,
            category: prod.category || 'bracelets',
            image: prod.image,
            salesCount: 0
          });
          count++;
          logMsg(`✅ [${count}/${newProducts.length}] Added (${prod.category}): ${prod.title}`);
        }

        logMsg("\n🎉 Upload complete! Duplicates skipped successfully.");
        alert(`Successfully added ${count} new products! Duplicates were automatically skipped.`);

      } catch (err) {
        logMsg(`❌ Error: ${err.message}`);
      }
    }
