<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYEZLING | Quick Add Products (Code Mode)</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #FAF8F5;
      color: #333;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .box {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      max-width: 650px;
      width: 100%;
      border: 1px solid #f2e6eb;
    }
    h1 { color: #8C3B5B; margin-bottom: 10px; font-size: 24px; }
    p { color: #666; font-size: 13px; margin-bottom: 25px; line-height: 1.6; }
    .btn {
      background: #8C3B5B;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      transition: background 0.3s;
    }
    .btn:hover { background: #6b2d45; }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f8f9fa;
      font-size: 13px;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>AYEZLING - Direct Product Loader</h1>
    <p>Click the button below to upload products directly to Firebase. To add new items in the future, edit the <b>productsToAdd</b> array in this file.</p>

    <button class="btn" onclick="uploadProductsToFirebase()">🚀 Add New Products to Firebase</button>

    <div class="status" id="logBox">Status: Ready...</div>
  </div>

  <!-- Firebase Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyASgbdHr8Vc1EWaEVxZvZA9-TYbJnUfcws",
      authDomain: "ayezling.firebaseapp.com",
      databaseURL: "https://ayezling-default-rtdb.firebaseio.com",
      projectId: "ayezling",
      messagingSenderId: "178860148015",
      appId: "1:178860148015:web:339d74bb9f0b41b6574dda"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();


    // =========================================================================
    // 🔴 🔴 🔴 ADD YOUR PRODUCTS BELOW BY CATEGORY 🔴 🔴 🔴
    // =========================================================================
    // Instructions:
    // 1. Image path should be local (e.g., "images/bracelet1.jpeg") or full URL.
    // 2. Categories must be one of: "bracelets", "charms", "keychains", "necklaces", "earrings".
    // 3. Make sure to separate product blocks with commas (,).
    
    const productsToAdd = [

      // -----------------------------------------------------------------------
      // CATEGORY 1: BRACELETS (category: "bracelets")
      // -----------------------------------------------------------------------
      {
        title: "Couples Matching Bracelet",
        price: 700,
        category: "bracelets",
        image: "images/bracelet1.jpeg"
      },
      {
        title: "Cute Pearl Bracelet",
        price: 500,
        category: "bracelets",
        image: "images/bracelet2.jpeg"
      },
      /* PASTE NEW BRACELETS HERE:
      ,{
        title: "Title Here",
        price: 600,
        category: "bracelets",
        image: "images/bracelet3.jpeg"
      }
      */


      // -----------------------------------------------------------------------
      // CATEGORY 2: PHONE CHARMS (category: "charms")
      // -----------------------------------------------------------------------
      {
        title: "Beaded Phone Charm",
        price: 450,
        category: "charms",
        image: "images/charm1.jpeg"
      },
      /* PASTE NEW PHONE CHARMS HERE:
      ,{
        title: "Title Here",
        price: 450,
        category: "charms",
        image: "images/phone-charm2.jpeg"
      }
      */


      // -----------------------------------------------------------------------
      // CATEGORY 3: KEYCHAINS (category: "keychains")
      // -----------------------------------------------------------------------
      {
        title: "Custom Crystal Keychain",
        price: 350,
        category: "keychains",
        image: "images/keychain1.jpeg"
      },
      /* PASTE NEW KEYCHAINS HERE:
      ,{
        title: "Title Here",
        price: 400,
        category: "keychains",
        image: "images/keychain2.jpeg"
      }
      */


      // -----------------------------------------------------------------------
      // CATEGORY 4: NECKLACES (category: "necklaces")
      // -----------------------------------------------------------------------
      {
        title: "Aesthetic Pendant Necklace",
        price: 850,
        category: "necklaces",
        image: "images/necklace1.jpeg"
      },
      /* PASTE NEW NECKLACES HERE:
      ,{
        title: "Title Here",
        price: 900,
        category: "necklaces",
        image: "images/necklace2.jpeg"
      }
      */


      // -----------------------------------------------------------------------
      // CATEGORY 5: EARRINGS (category: "earrings")
      // -----------------------------------------------------------------------
      {
        title: "Floral Dangle Earrings",
        price: 400,
        category: "earrings",
        image: "images/earrings1.jpeg"
      }
      /* PASTE NEW EARRINGS HERE:
      ,{
        title: "Title Here",
        price: 450,
        category: "earrings",
        image: "images/earrings2.jpeg"
      }
      */

    ];
    // =========================================================================


    function logMsg(msg) {
      const logBox = document.getElementById('logBox');
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function uploadProductsToFirebase() {
      if (!productsToAdd || productsToAdd.length === 0) {
        alert("No products found to upload!");
        return;
      }

      document.getElementById('logBox').innerText = "Starting upload to Firebase...";

      let count = 0;
      productsToAdd.forEach((prod) => {
        const newRef = database.ref('products').push();
        newRef.set({
          title: prod.title,
          price: prod.price,
          category: prod.category || 'bracelets',
          image: prod.image,
          salesCount: 0
        }).then(() => {
          count++;
          logMsg(`✅ [${count}/${productsToAdd.length}] Added (${prod.category}): ${prod.title}`);
          if (count === productsToAdd.length) {
            logMsg("\n🎉 All products uploaded successfully!");
            alert("All Products Added Successfully!");
          }
        }).catch((err) => {
          logMsg(`❌ Error adding ${prod.title}: ${err.message}`);
        });
      });
    }
  </script>
</body>
</html>
