<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | AYEZLING</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { 
      --primary: #8C3B5B; 
      --bg: #FAF8F5; 
      --card-bg: #FFFFFF; 
      --text: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); padding: 30px 20px 50px; }

    .cart-container { 
      max-width: 520px; 
      margin: 0 auto; 
      background: var(--card-bg); 
      padding: 30px 25px; 
      border-radius: 20px; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.04); 
      border: 1px solid #f2e6eb;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .back-btn {
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s;
    }

    .back-btn:hover { transform: translateX(-3px); }

    h2 { 
      color: var(--primary); 
      font-family: 'Cormorant Garamond', serif; 
      font-size: 32px; 
    }

    .btn-clear-all {
      background: transparent;
      border: none;
      color: #cc4444;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* PRODUCT ITEM STYLING */
    .cart-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      border-bottom: 1px solid #f2e6eb; 
      padding: 16px 0; 
      gap: 12px;
    }

    .item-left { display: flex; align-items: center; gap: 15px; flex: 1; }
    
    .item-img { 
      width: 70px; 
      height: 70px; 
      object-fit: cover; 
      border-radius: 12px; 
      border: 1px solid #f2e6eb; 
      background: #f9f9f9;
    }

    .item-details { display: flex; flex-direction: column; gap: 4px; }
    .item-title { font-size: 14px; font-weight: 600; color: #333; }
    .item-price { font-size: 13px; color: var(--primary); font-weight: 600; }
    
    /* QUANTITY CONTROLS */
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FAF8F5;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #eee;
    }

    .qty-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-number { font-size: 13px; font-weight: 600; color: #333; }

    .remove-btn { 
      color: #d9534f; 
      cursor: pointer; 
      font-size: 14px; 
      padding: 5px;
      transition: color 0.2s;
    }

    .remove-btn:hover { color: #a94442; }

    .total-box { 
      margin-top: 25px; 
      padding-top: 18px; 
      border-top: 2px solid #f2e6eb; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label { font-size: 15px; font-weight: 600; color: #555; }
    .total-price { font-size: 22px; font-weight: 700; color: var(--primary); }

    .btn-checkout { 
      display: block; 
      width: 100%; 
      background: var(--primary); 
      color: white; 
      padding: 15px; 
      border-radius: 30px; 
      text-align: center; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-top: 20px; 
      box-shadow: 0 4px 15px rgba(140, 59, 91, 0.25);
      transition: opacity 0.2s;
    }

    .btn-checkout:hover { opacity: 0.95; }

    .empty-cart-msg {
      text-align: center;
      padding: 40px 10px;
    }

    .empty-cart-msg i {
      font-size: 45px;
      color: #e0d0d8;
      margin-bottom: 15px;
    }

    .empty-cart-msg p {
      font-size: 15px;
      color: #777;
      margin-bottom: 20px;
    }

    .btn-shop-now {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 10px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="cart-container">
  <div class="cart-header">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Continue Shopping
    </a>
    <button class="btn-clear-all" id="btnClearAll" onclick="clearCart()" style="display: none;">
      <i class="fas fa-trash-alt"></i> Clear All
    </button>
  </div>

  <h2>Your Shopping Bag</h2>

  <div id="cart-items"></div>

  <div id="total-section" style="display: none;">
    <div class="total-box">
      <span class="total-label">Subtotal</span>
      <span class="total-price" id="total-amount">Rs. 0</span>
    </div>
    <a href="checkout.html" class="btn-checkout">Proceed to Checkout</a>
  </div>
</div>

<script>
  let rawCart = JSON.parse(localStorage.getItem('ayezling_cart')) || [];

  // Helper to ensure image path accuracy
  function getCleanImagePath(img) {
    if (!img) return 'https://via.placeholder.com/150?text=Ayezling';
    if (img.startsWith('http://') || img.startsWith('https://') || img.startsWith('data:image')) {
      return img;
    }
    if (img.startsWith('images/') || img.startsWith('./')) {
      return img;
    }
    return 'images/' + img;
  }

  // Aggregate cart array to handle item quantities
  function getGroupedCart() {
    const map = new Map();

    rawCart.forEach(item => {
      const key = item.title;
      if (map.has(key)) {
        const existing = map.get(key);
        existing.quantity += (item.quantity || 1);
      } else {
        map.set(key, {
          title: item.title,
          price: Number(item.price || 0),
          image: item.image,
          quantity: item.quantity || 1
        });
      }
    });

    return Array.from(map.values());
  }

  function renderCart() {
    const container = document.getElementById('cart-items');
    const totalSection = document.getElementById('total-section');
    const totalDisplay = document.getElementById('total-amount');
    const btnClearAll = document.getElementById('btnClearAll');

    const groupedCart = getGroupedCart();

    if (groupedCart.length === 0) {
      container.innerHTML = `
        <div class="empty-cart-msg">
          <i class="fas fa-shopping-bag"></i>
          <p>Your bag is currently empty.</p>
          <a href="index.html" class="btn-shop-now">Explore Collection</a>
        </div>
      `;
      totalSection.style.display = 'none';
      btnClearAll.style.display = 'none';
      return;
    }

    totalSection.style.display = 'block';
    btnClearAll.style.display = 'inline-flex';
    
    let grandTotal = 0;

    const itemsHtml = groupedCart.map((item, index) => {
      const itemTotal = item.price * item.quantity;
      grandTotal += itemTotal;
      const imgSrc = getCleanImagePath(item.image);

      return `
        <div class="cart-item">
          <div class="item-left">
            <img src="${imgSrc}" 
                 alt="${item.title}" 
                 class="item-img"
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Ayezling';">
            <div class="item-details">
              <span class="item-title">${item.title}</span>
              <span class="item-price">Rs. ${item.price}</span>
            </div>
          </div>

          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQuantity('${item.title.replace(/'/g, "\\'")}', -1)">-</button>
            <span class="qty-number">${item.quantity}</span>
            <button class="qty-btn" onclick="updateQuantity('${item.title.replace(/'/g, "\\'")}', 1)">+</button>
          </div>

          <span class="remove-btn" onclick="removeItemByTitle('${item.title.replace(/'/g, "\\'")}')" title="Remove Item">
            <i class="fas fa-trash"></i>
          </span>
        </div>
      `;
    }).join('');

    container.innerHTML = itemsHtml;
    totalDisplay.innerText = `Rs. ${grandTotal}`;
  }

  function updateQuantity(title, change) {
    if (change === 1) {
      const itemToDuplicate = rawCart.find(i => i.title === title);
      if (itemToDuplicate) {
        rawCart.push({ ...itemToDuplicate });
      }
    } else if (change === -1) {
      const indexToRemove = rawCart.findIndex(i => i.title === title);
      if (indexToRemove !== -1) {
        rawCart.splice(indexToRemove, 1);
      }
    }

    localStorage.setItem('ayezling_cart', JSON.stringify(rawCart));
    renderCart();
  }

  function removeItemByTitle(title) {
    rawCart = rawCart.filter(i => i.title !== title);
    localStorage.setItem('ayezling_cart', JSON.stringify(rawCart));
    renderCart();
  }

  function clearCart() {
    if (confirm("Are you sure you want to clear your cart?")) {
      rawCart = [];
      localStorage.setItem('ayezling_cart', JSON.stringify(rawCart));
      renderCart();
    }
  }

  renderCart();
</script>

</body>
</html>
